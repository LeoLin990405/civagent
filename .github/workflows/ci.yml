name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    # Matrix rationale (see report R8-3): Node 20 is the current minimum
    # declared in package.json engines (Node 20 was the previous CI target
    # and remains an active LTS line); Node 22 is the current maintenance LTS
    # and is what the frontend job already targets. Both are exercised so a
    # regression on either the minimum-supported line or the current LTS is
    # caught by CI, without blowing up wall-clock or Actions minutes on a
    # wider matrix.
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Syntax check (node + bash)
        run: npm run lint:syntax
      - name: ESLint (engine + server + tests)
        run: npm run lint:backend
      - name: Unit tests
        run: npm test
      - name: Validate all 57 regimes
        run: npm run validate:regimes
      - name: End-to-end smoke (topology → metrics → baseline, zero API keys)
        run: npm run smoke

  frontend:
    # Frontend keeps its own single-version pin: 22 is the version the app is
    # actually built against and matches the backend's upper matrix leg, so a
    # divergence there would still be caught by the backend matrix.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build (typecheck + bundle)
        run: npm run build
      - name: Lint (no errors; React-Compiler hints remain warnings)
        run: npm run lint
      - name: Test (vitest + testing-library)
        run: npm test
